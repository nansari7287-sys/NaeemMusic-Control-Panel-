name = "naeem-music-control-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[vars]
PUBLIC_MEDIA_BASE_URL = "https://media.example.com"

[[d1_databases]]
binding = "DB"
database_name = "naeem-music-control"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "naeem-music-media"
